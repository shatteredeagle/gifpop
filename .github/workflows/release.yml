name: Release
# Push a tag vX.Y.Z (matching gifpop/__init__.py) to build and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install PyQt6
      - name: Tag matches version
        run: |
          v=$(python -c "import gifpop; print(gifpop.__version__)")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: python scripts/changelog_section.py "$GITHUB_REF_NAME" > dist-notes.md
      - name: Build (KLIPY key baked in)
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          PYTHON: python
        run: |
          [ -n "$KLIPY_API_KEY" ] || { echo "Repo secret KLIPY_API_KEY is not set"; exit 1; }
          scripts/build.sh
          mkdir -p check && tar -xzf dist/gifpop-*.tar.gz -C check
          if grep -rqF "$KLIPY_API_KEY" check/; then echo "plain key found in the build"; exit 1; fi
          mv dist-notes.md dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat dist/notes.md
            echo
            echo "## Install"
            echo
            echo '1. Install PyQt6 from your distro (Arch: `sudo pacman -S python-pyqt6 qt6-imageformats`, Debian/Ubuntu: `sudo apt install python3-pyqt6`, Fedora: `sudo dnf install python3-pyqt6`).'
            echo "2. Download \`gifpop-${GITHUB_REF_NAME#v}.tar.gz\`, extract it, and run \`./install.sh\` inside the folder."
            echo "3. Press Win+. (KDE Plasma). Built for Plasma on Wayland."
            echo
            echo 'Check the download: `sha256sum -c SHA256SUMS`'
          } > body.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "GifPop ${GITHUB_REF_NAME#v}" --notes-file body.md \
            dist/gifpop-*.tar.gz dist/SHA256SUMS

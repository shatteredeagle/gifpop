name: Release
# Push a tag vX.Y.Z (matching gifpop/__init__.py) to build and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # Oldest supported runner on purpose: the bundle runs on glibc >= the build host's (2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (also bundled from here)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Build toolchain (pinned)
        run: pip install -r packaging/requirements-build.txt
      - name: Tag matches version
        run: |
          v=$(python -c "import gifpop; print(gifpop.__version__)")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: python scripts/changelog_section.py "$GITHUB_REF_NAME" > notes.md
      - name: Build the bundle (KLIPY key baked in; runs the source + frozen smoke tests)
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          PYTHON: python
        run: |
          [ -n "$KLIPY_API_KEY" ] || { echo "Repo secret KLIPY_API_KEY is not set"; exit 1; }
          scripts/build.sh
      - name: Check the tarball
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: |
          mkdir check && tar -xzf dist/gifpop.tar.gz -C check
          d=$(echo check/gifpop-*)
          [ "$d" = "check/gifpop-${GITHUB_REF_NAME#v}" ] || { echo "unexpected folder $d"; exit 1; }
          for f in app/gifpop install.sh uninstall.sh README.md LICENSE CHANGELOG.md; do test -e "$d/$f"; done
          (cd dist && sha256sum -c SHA256SUMS)
          if grep -rqaF "$KLIPY_API_KEY" check/; then echo "plain key found in the bundle"; exit 1; fi
          scripts/smoke_frozen.sh "$d/app/gifpop"
          du -sh dist/gifpop.tar.gz "$d/app"
          cp get.sh notes.md dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat dist/notes.md
            echo
            echo "## Install"
            echo
            echo "For KDE Plasma on Wayland (x86_64). Everything GifPop needs is in the download, nothing else to install:"
            echo
            echo '```sh'
            echo 'curl -fsSL https://github.com/shatteredeagle/gifpop/releases/latest/download/get.sh | bash'
            echo '```'
            echo
            echo "It checks the download against \`SHA256SUMS\`, installs for your user (no root) and offers to bind Win+. on Plasma. Run it again to update."
            echo
            echo "By hand: download \`gifpop-${GITHUB_REF_NAME#v}.tar.gz\`, check it with \`sha256sum -c SHA256SUMS --ignore-missing\`, extract it and run \`./install.sh\` in the folder."
            echo
            echo 'Remove: `~/.local/lib/gifpop/uninstall.sh` (`--purge` also deletes settings and recents).'
          } > body.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "GifPop ${GITHUB_REF_NAME#v}" --notes-file body.md \
            dist/gifpop-*.tar.gz dist/gifpop.tar.gz dist/SHA256SUMS dist/get.sh

name: Tiling WMs
# GifPop's popup must float (not tile), keep its 480x600 size, open centred and focused,
# be re-shown by a second `gifpop`, and stop on `gifpop --quit` - on sway (Wayland) and i3 (X11).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tiling:
    name: ${{ matrix.wm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        wm: [sway, i3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Window manager and Qt runtime libraries
        env:
          WM: ${{ matrix.wm }}
        run: |
          case "$WM" in
            sway) wm_pkgs="sway" ;;
            i3) wm_pkgs="i3-wm xvfb x11-utils" ;;
          esac
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $wm_pkgs jq dbus dbus-bin \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: PyQt6 (same pins as packaging/requirements-build.txt)
        run: pip install PyQt6==6.11.0 PyQt6-Qt6==6.11.2 PyQt6-sip==13.13.0
      - name: Run the ${{ matrix.wm }} test
        env:
          PYTHON: python
          WM: ${{ matrix.wm }}
        run: bash "tests/tiling/run_$WM.sh"

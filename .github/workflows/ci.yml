name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Oldest supported runner on purpose: the bundle runs on glibc >= the build host's (2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (also bundled from here)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Build toolchain (pinned)
        run: pip install -r packaging/requirements-build.txt
      - name: Blur helper toolchain
        run: sudo apt-get install -y --no-install-recommends g++ libwayland-dev libwayland-bin pkg-config
      - name: Restore Qt 6.11.2 (headers for the blur helper; matches PyQt6-Qt6)
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qt
          key: qt-6.11.2-linux_gcc_64-aqtinstall-3.3.0
      - name: Install Qt 6.11.2 (aqtinstall, pinned)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt linux desktop 6.11.2 linux_gcc_64 -O "$RUNNER_TEMP/qt"
      - name: Point the build at it (build.sh then requires the blur helper)
        run: |
          test -d "$RUNNER_TEMP/qt/6.11.2/gcc_64/include/QtGui"
          echo "QT_PREFIX=$RUNNER_TEMP/qt/6.11.2/gcc_64" >> "$GITHUB_ENV"
      - name: Syntax
        run: |
          python -m py_compile gifpop/*.py scripts/*.py tests/*.py packaging/*.py
          bash -n install.sh uninstall.sh get.sh scripts/build.sh scripts/smoke_frozen.sh \
            packaging/blurhelper/build.sh
      - name: No key in the repo
        run: test ! -e gifpop/_builtin.py
      - name: Smoke test from source (no key)
        run: python tests/smoke.py
      - name: Build the bundle with a dummy key (runs the source + frozen smoke tests)
        env:
          KLIPY_API_KEY: ci-dummy-key
          PYTHON: python
        run: scripts/build.sh
      - name: Check the tarball
        run: |
          mkdir check && tar -xzf dist/gifpop.tar.gz -C check
          d=$(echo check/gifpop-*)
          for f in app/gifpop install.sh uninstall.sh README.md LICENSE CHANGELOG.md; do test -e "$d/$f"; done
          (cd dist && sha256sum -c SHA256SUMS)
          if grep -rqaF ci-dummy-key check/; then echo "plain key found in the bundle"; exit 1; fi
          scripts/smoke_frozen.sh "$d/app/gifpop"
          du -sh dist/gifpop.tar.gz "$d/app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gifpop-bundle-dummy-key
          path: dist/gifpop.tar.gz
          retention-days: 7
